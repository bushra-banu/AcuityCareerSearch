; Pytest settings: base URL, browser, reporters and recorded artifacts.
; Timeouts and the viewport are set in conftest.py.

[pytest]
testpaths = tests
pythonpath = .
base_url = https://careers.acuityinc.com
markers =
    search: career search and apply flow, blocks the application POST
    registration: creates a real, permanent account on the live site
addopts =
    --strict-markers
    --browser=chromium
    --device="Desktop Chrome"
    --output=reports/artifacts
    --video=on
    --screenshot=on
    --tracing=on
    --html=reports/html/index.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --json-report
    --json-report-file=reports/results.json
    --alluredir=reports/allure-results
